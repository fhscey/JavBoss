name: build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch or tag to build"
        required: false
        default: "main"
      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - windows-x86_64
          - windows-arm64
          - linux-x86_64
          - macos-x86_64
          - macos-arm64
      version:
        description: "Release version"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "23.11.0"

jobs:
  build:
    runs-on: ${{ fromJson('{"windows-x86_64":"ubuntu-latest","windows-arm64":"ubuntu-latest","linux-x86_64":"ubuntu-latest","macos-x86_64":"macos-15-intel","macos-arm64":"macos-14"}')[inputs.platform] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build deps (Windows target)
        if: ${{ inputs.platform == 'windows-x86_64' || inputs.platform == 'windows-arm64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Install MinGW (Windows x86_64 target)
        if: ${{ inputs.platform == 'windows-x86_64' }}
        run: sudo apt-get install -y mingw-w64

      - name: Install ARM64 cross compiler
        if: ${{ inputs.platform == 'windows-arm64' }}
        run: |
          TOOLCHAIN_VERSION=20261006
          TOOLCHAIN_ARCHIVE="llvm-mingw-${TOOLCHAIN_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          TOOLCHAIN_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${TOOLCHAIN_VERSION}/${TOOLCHAIN_ARCHIVE}"
          TOOLCHAIN_SHA256=5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
          curl -L --fail --retry 3 "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/$TOOLCHAIN_ARCHIVE"
          echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/$TOOLCHAIN_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/$TOOLCHAIN_ARCHIVE" --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Install build deps (Linux target)
        if: ${{ inputs.platform == 'linux-x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Build CLI bundle
        run: |
          cd scripts/cli
          npm install
          npm run build

      - name: Download ffmpeg/ffprobe
        run: bash scripts/cli.sh download-dependencies "${{ inputs.platform }}"

      - name: Build release
        run: bash scripts/cli.sh release "${{ inputs.platform }}" "${{ inputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: javboss-${{ inputs.version }}-${{ inputs.platform }}
          path: release/javboss-${{ inputs.version }}-${{ inputs.platform }}
